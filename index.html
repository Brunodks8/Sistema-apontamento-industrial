<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">

<body>

    <main>

    <form id="form">
        <h1>INSERIR APONTAMENTO</h1>

        <label for="item">Item:</label>

        <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade">

        <label for="maq">Máquina:</label>
        <input type="text" id="maq">

        <label for="turno">Turno:</label>
        <input type="text" id="turno">

        <div id="btn">
        <button type="submit" id="sub">Enviar</button>
        <button type="button" id="export">Exportar xml</button>
        </div>
    </form>




    <!--
    <table> cria a tabela
    <tr> cria uma linha
    <th> cria uma célula de cabeçalho
    <td> cria uma célula de dados
    <thead> Agrupa o cabeçalho
    <tbody> corpo da planilha
    <tfoot> rodapé planilha
    
    -->
    <div class="table-container">
    <table>

        <thead>
            <tr>
             <th>Item</th>
             <th>Quantidade</th>
             <th>Máquina</th>
             <th>Turno</th>
             <th>Del</th>  
             <th>Edit</th>  

            </tr>
        </thead>

        <tbody id="tbody">
            <tr>

            </tr>
        </tbody>


    </table>
    </div>
    
    </main>

</body>
